<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whapineo Admin Panel</title>
    <style>
        /* General styles, re-using some from main app for consistency */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a4d3a 50%, #2d5a2d 100%);
            min-height: 100vh;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            color: #1a4d3a;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .auth-section, .admin-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            border: 1px solid #eee;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #2d5a2d;
            box-shadow: 0 0 10px rgba(45, 90, 45, 0.3);
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #1a4d3a, #2d5a2d);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(26, 77, 58, 0.4);
        }

        .btn-danger {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }

        .btn-warning { /* New button style for "Clear All" */
            background: linear-gradient(45deg, #f39c12, #e67e22);
            color: white;
        }
        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.4);
        }

        .btn-info { /* New button style for "Toggle Partner" */
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
        }
        .btn-info:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .btn-success-light { /* New button for Edit */
            background: linear-gradient(45deg, #2ecc71, #27ae60);
            color: white;
        }
        .btn-success-light:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
        }

        .btn-admin-action { /* General style for admin boost/unboost */
            background: linear-gradient(45deg, #8e44ad, #9b59b6);
            color: white;
            font-size: 0.9em;
            padding: 8px 12px;
            margin-top: 5px; /* Spacing between admin action buttons */
        }
        .btn-admin-action:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(142, 68, 173, 0.4);
        }


        .channel-list {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        .channel-item {
            display: flex;
            flex-wrap: wrap; /* Pozwól na zawijanie elementów */
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
            background: #fdfdfd;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            text-align: left; /* Align text within item to left */
        }

        .channel-item:last-child {
            border-bottom: none;
        }

        .channel-item-info {
            flex-grow: 1;
            /* text-align: left; -> already on channel-item */
            margin-bottom: 10px; /* Added margin for small screens */
        }
        
        .channel-item-actions {
            display: flex;
            flex-direction: column; /* Przyciski w kolumnie na małych ekranach */
            gap: 10px;
            align-items: flex-end; /* Wyrównaj przyciski do prawej na dużych ekranach */
            width: 100%; /* Na małych ekranach zajmij całą szerokość */
            margin-top: 10px; /* Space between info and actions on small screens */
        }
        
        /* New: for comment actions */
        .comment-actions {
            margin-left: 10px; /* Space between comment text and delete button */
        }

        @media (min-width: 768px) { /* Na większych ekranach zmień układ na wiersz */
            .channel-item-info {
                margin-bottom: 0;
            }
            .channel-item-actions {
                flex-direction: row;
                width: auto;
                margin-top: 0; /* Remove margin when in row */
            }
        }


        .channel-item-info h4 {
            margin: 0;
            color: #333;
            font-size: 1.1em;
            word-break: break-word;
        }

        .channel-item-info p {
            margin: 5px 0 0;
            font-size: 0.9em;
            color: #666;
            word-break: break-word;
        }

        .channel-item-comments {
            width: 100%; /* Take full width below channel info and actions */
            margin-top: 15px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .comment {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid #2d5a2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .comment-text {
            flex-grow: 1;
        }
        .comment-text p {
            margin: 0;
            font-size: 0.9em;
        }
        .comment-author-date {
            font-size: 0.8em;
            color: #777;
            margin-top: 5px;
        }


        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.3s ease-out;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            background: linear-gradient(45deg, #56ab2f, #a8e6cf);
        }

        .notification.error {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2d5a2d;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Modal Styles */
        .modal {
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            z-index: 1001; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            overflow: auto; /* Enable scroll if needed */
            background-color: rgba(0,0,0,0.4); /* Black w/ opacity */
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background-color: #fefefe;
            margin: auto; /* Center modal */
            padding: 30px;
            border: 1px solid #888;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            animation-name: animatetop;
            animation-duration: 0.4s;
            text-align: left;
        }

        /* Add Animation */
        @keyframes animatetop {
            from {top: -300px; opacity: 0}
            to {top: 0; opacity: 1}
        }

        .close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            margin-top: -20px;
            margin-right: -10px;
        }

        .close-button:hover,
        .close-button:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        .modal-buttons {
            text-align: right;
            margin-top: 20px;
        }
        .modal-buttons button {
            margin-left: 10px;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .container {
                margin: 10px;
                padding: 15px;
            }
            h1 {
                font-size: 1.8em;
            }
            .form-input, .btn {
                padding: 12px;
                font-size: 14px;
            }
            .channel-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .channel-item-info {
                margin-bottom: 10px;
            }
            .btn-danger {
                width: 100%;
            }
            .modal-content {
                width: 95%;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ Whapineo Admin Panel</h1>

        <div id="authSection" class="auth-section">
            <h2>Enter Administrator Passwords</h2>
            <div class="form-group">
                <label for="passwordOne">Password 1:</label>
                <input type="password" class="form-input" id="passwordOne" required>
            </div>
            <div class="form-group">
                <label for="passwordTwo">Password 2:</label>
                <input type="password" class="form-input" id="passwordTwo" required>
            </div>
            <button class="btn btn-primary" onclick="verifyPasswords()">Login</button>
        </div>

        <div id="adminContent" class="admin-content" style="display: none;">
            <h2>Channel Management</h2>
            <div id="channelsAdminList">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading channels for management...</p>
                </div>
            </div>
            <button class="btn btn-warning" onclick="showConfirmModal('Are you sure you want to delete ALL channels and comments? This is IRREVERSIBLE!', clearAllChannels)">Clear All Channels</button>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <!-- Custom Confirmation Modal -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="hideConfirmModal()">&times;</span>
            <p id="confirmModalMessage"></p>
            <div class="modal-buttons">
                <button class="btn btn-danger" id="confirmModalYesBtn">Yes</button>
                <button class="btn btn-primary" onclick="hideConfirmModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Edit Channel Modal -->
    <div id="editChannelModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="hideEditChannelModal()">&times;</span>
            <h2>Edit Channel</h2>
            <input type="hidden" id="editChannelId">
            <div class="form-group">
                <label for="editChannelName">Name:</label>
                <input type="text" class="form-input" id="editChannelName" required>
            </div>
            <div class="form-group">
                <label for="editChannelDescription">Description:</label>
                <textarea class="form-input" id="editChannelDescription" rows="4"></textarea>
            </div>
            <div class="form-group">
                <label for="editChannelLink">Link:</label>
                <input type="url" class="form-input" id="editChannelLink" required>
            </div>
            <div class="form-group">
                <label for="editProfileImageUrl">Profile Image URL:</label>
                <input type="url" class="form-input" id="editProfileImageUrl">
            </div>
            <div class="form-group">
                <label for="editChannelCategory">Country:</label>
                <input type="text" class="form-input" id="editChannelCategory" value="General">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="submitEditChannel()">Save Changes</button>
                <button class="btn btn-danger" onclick="hideEditChannelModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://whapineobackend.onrender.com'; // Your Render backend URL here
        let adminToken = null; // Stores the token received after successful login

        /**
         * Displays a temporary notification message on the screen.
         * @param {string} message The message to display.
         * @param {string} type The type of notification ('success' or 'error').
         */
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        /**
         * Shows a custom confirmation modal.
         * @param {string} message The message to display in the modal.
         * @param {function} callback The function to execute if the user confirms.
         */
        function showConfirmModal(message, callback) {
            const modal = document.getElementById('confirmModal');
            const messageElement = document.getElementById('confirmModalMessage');
            const yesBtn = document.getElementById('confirmModalYesBtn');

            messageElement.textContent = message;
            yesBtn.onclick = () => {
                hideConfirmModal();
                callback();
            };
            modal.style.display = 'flex'; // Use flex to center
        }

        /**
         * Hides the custom confirmation modal.
         */
        function hideConfirmModal() {
            document.getElementById('confirmModal').style.display = 'none';
        }

        /**
         * Verifies the entered passwords to grant access to the admin panel.
         */
        async function verifyPasswords() {
            const passOne = document.getElementById('passwordOne').value;
            const passTwo = document.getElementById('passwordTwo').value;

            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ passwordOne: passOne, passwordTwo: passTwo })
                });

                if (response.ok) {
                    const data = await response.json();
                    adminToken = data.token; // Store the received token
                    document.getElementById('authSection').style.display = 'none';
                    document.getElementById('adminContent').style.display = 'block';
                    loadAdminChannels();
                    showNotification('Login successful!', 'success');
                } else {
                    const errorData = await response.json();
                    showNotification(errorData.error || 'Invalid passwords. Please try again.', 'error');
                }
            } catch (error) {
                console.error('Admin login error:', error);
                showNotification('Server connection error during login.', 'error');
            }
        }

        /**
         * Loads channels for the admin panel.
         */
        async function loadAdminChannels() {
            const channelsAdminList = document.getElementById('channelsAdminList');
            channelsAdminList.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading channels for management...</p>
                </div>
            `;
            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/channels`, {
                    headers: {
                        'Authorization': `Bearer ${adminToken}` // Include the token
                    }
                });
                if (response.ok) {
                    const channels = await response.json();
                    renderAdminChannels(channels);
                } else {
                    const errorData = await response.json();
                    showNotification(errorData.error || 'Error loading channels for management', 'error');
                    channelsAdminList.innerHTML = '<p style="color: #e74c3c;">Failed to load channels for management. Make sure you are logged in.</p>';
                }
            } catch (error) {
                console.error('Error loading channels for management:', error);
                showNotification('Server connection error while loading channels for management.', 'error');
                channelsAdminList.innerHTML = '<p style="color: #e74c3c;">No server connection.</p>';
            }
        }

        /**
         * Renders channels in the admin panel with delete buttons and partner toggle.
         * @param {Array} channels The array of channel objects to display.
         */
        function renderAdminChannels(channels) {
            const channelsAdminList = document.getElementById('channelsAdminList');
            if (channels.length === 0) {
                channelsAdminList.innerHTML = '<p>No channels to manage.</p>';
                return;
            }

            const listHTML = channels.map(channel => `
                <li class="channel-item">
                    <div class="channel-item-info">
                        <h4>${channel.name} (ID: ${channel.id})</h4>
                        <p>Description: ${channel.description}</p>
                        <p>Link: <a href="${channel.link}" target="_blank">${channel.link}</a></p>
                        <p>Image: ${channel.profileImageUrl ? `<a href="${channel.profileImageUrl}" target="_blank">Link</a>` : 'None'}</p>
                        <p>Followers: ${channel.followerCount !== undefined ? channel.followerCount : 0}</p>
                        <p>Rating: ${channel.rating.toFixed(1)}/5 (${channel.ratingsCount} ratings)</p>
                        <p>Country: <strong>${channel.category}</strong></p>
                        <p>Partner: <strong>${channel.is_partner ? 'YES' : 'NO'}</strong></p>
                    </div>
                    <div class="channel-item-actions">
                        <button class="btn btn-admin-action" onclick="adminBoostChannel(${channel.id})">Admin Boost</button>
                        <button class="btn btn-admin-action" onclick="adminUnboostChannel(${channel.id})">Admin Unboost</button>
                        <button class="btn btn-success-light" onclick="showEditChannelModal(${channel.id}, '${channel.name.replace(/'/g, "\\'")}', '${channel.description.replace(/'/g, "\\'")}', '${channel.link.replace(/'/g, "\\'")}', '${channel.profileImageUrl ? channel.profileImageUrl.replace(/'/g, "\\'") : ''}', '${channel.category.replace(/'/g, "\\'")}')">Edit Channel</button>
                        <button class="btn btn-info" onclick="togglePartnerStatus(${channel.id}, ${channel.is_partner ? 'true' : 'false'})">
                            ${channel.is_partner ? 'Remove from Partners' : 'Set as Partner'}
                        </button>
                        <button class="btn btn-danger" onclick="showConfirmModal('Are you sure you want to delete channel &quot;${channel.name.replace(/'/g, "&quot;")}&quot; (ID: ${channel.id})? This is irreversible!', () => deleteChannel(${channel.id}))">Delete Channel</button>
                    </div>
                    <div class="channel-item-comments">
                        <h5>Comments:</h5>
                        ${channel.comments.length > 0 ? channel.comments.map(comment => `
                            <div class="comment">
                                <div class="comment-text">
                                    <p>${comment.text}</p>
                                    <p class="comment-author-date">Author: ${comment.author} (${comment.date})</p>
                                </div>
                                <button class="btn btn-danger btn-sm comment-actions" onclick="showConfirmModal('Are you sure you want to delete comment with ID ${comment.id}?', () => deleteComment(${comment.id}))">Delete</button>
                            </div>
                        `).join('') : '<p>No comments.</p>'}
                    </div>
                </li>
            `).join('');
            channelsAdminList.innerHTML = `<ul class="channel-list">${listHTML}</ul>`;
        }

        /**
         * Sends an admin boost request for a channel.
         * @param {number} channelId The ID of the channel to boost.
         */
        async function adminBoostChannel(channelId) {
            if (!adminToken) {
                showNotification('Authorization error: Missing admin token. Please log in again.', 'error');
                return;
            }
            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/channels/${channelId}/admin_boost`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${adminToken}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    showNotification(data.message, 'success');
                    loadAdminChannels(); // Reload the list to reflect changes
                } else {
                    const errorData = await response.json();
                    showNotification(errorData.error || 'Error admin boosting channel.', 'error');
                }
            } catch (error) {
                console.error('Error admin boosting channel:', error);
                showNotification('Server connection error during admin boost.', 'error');
            }
        }

        /**
         * Sends an admin unboost request for a channel.
         * @param {number} channelId The ID of the channel to unboost.
         */
        async function adminUnboostChannel(channelId) {
            if (!adminToken) {
                showNotification('Authorization error: Missing admin token. Please log in again.', 'error');
                return;
            }
            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/channels/${channelId}/admin_unboost`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${adminToken}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    showNotification(data.message, 'success');
                    loadAdminChannels(); // Reload the list to reflect changes
                } else {
                    const errorData = await response.json();
                    showNotification(errorData.error || 'Error admin unboosting channel.', 'error');
                }
            } catch (error) {
                console.error('Error admin unboosting channel:', error);
                showNotification('Server connection error during admin unboost.', 'error');
            }
        }


        /**
         * Shows the edit channel modal and populates it with current channel data.
         * @param {number} id Channel ID.
         * @param {string} name Channel name.
         * @param {string} description Channel description.
         * @param {string} link Channel link.
         * @param {string} profileImageUrl Channel profile image URL.
         * @param {string} category Channel category.
         */
        function showEditChannelModal(id, name, description, link, profileImageUrl, category) {
            document.getElementById('editChannelId').value = id;
            document.getElementById('editChannelName').value = name;
            document.getElementById('editChannelDescription').value = description;
            document.getElementById('editChannelLink').value = link;
            document.getElementById('editProfileImageUrl').value = profileImageUrl;
            document.getElementById('editChannelCategory').value = category || 'Ogólne'; // Set default if null/empty
            document.getElementById('editChannelModal').style.display = 'flex';
        }

        /**
         * Hides the edit channel modal.
         */
        function hideEditChannelModal() {
            document.getElementById('editChannelModal').style.display = 'none';
        }

        /**
         * Submits the edited channel data to the backend.
         */
        async function submitEditChannel() {
            if (!adminToken) {
                showNotification('Authorization error: Missing admin token. Please log in again.', 'error');
                return;
            }

            const channelId = document.getElementById('editChannelId').value;
            const name = document.getElementById('editChannelName').value.trim();
            const description = document.getElementById('editChannelDescription').value.trim();
            const link = document.getElementById('editChannelLink').value.trim();
            const profileImageUrl = document.getElementById('editProfileImageUrl').value.trim();
            const category = document.getElementById('editChannelCategory').value.trim();

            if (!name || !description || !link) {
                showNotification('Name, description and link are required!', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/channels/${channelId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${adminToken}`
                    },
                    body: JSON.stringify({ name, description, link, profileImageUrl, category })
                });

                if (response.ok) {
                    showNotification('Channel updated successfully!', 'success');
                    hideEditChannelModal();
                    loadAdminChannels(); // Reload list to show changes
                } else {
                    const errorData = await response.json();
                    showNotification(errorData.error || 'Error updating channel.', 'error');
                }
            } catch (error) {
                console.error('Error sending channel update:', error);
                showNotification('Server connection error while updating channel.', 'error');
            }
        }


        /**
         * Deletes a comment from a channel.
         * @param {number} commentId The ID of the comment to delete.
         */
        async function deleteComment(commentId) {
            if (!adminToken) {
                showNotification('Błąd autoryzacji: Brak tokena administratora. Zaloguj się ponownie.', 'error');
                return;
            }
            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/comments/${commentId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${adminToken}` // Include the token
                    }
                });

                if (response.ok) {
                    showNotification(`Comment with ID ${commentId} has been deleted.`, 'success');
                    loadAdminChannels(); // Reload the list after deletion
                } else {
                    const errorData = await response.json();
                    showNotification(errorData.error || `Error deleting comment with ID ${commentId}`, 'error');
                }
            }
            catch (error) {
                console.error(`Error deleting comment with ID ${commentId}:`, error);
                showNotification('Server connection error while deleting comment.', 'error');
            }
        }


        /**
         * Toggles the partner status of a channel.
         * @param {number} channelId The ID of the channel to toggle.
         * @param {boolean} currentStatus The current partner status of the channel.
         */
        async function togglePartnerStatus(channelId, currentStatus) {
            if (!adminToken) {
                showNotification('Authorization error: Missing admin token. Please log in again.', 'error');
                return;
            }
            const action = currentStatus ? "remove from partners" : "set as partner";
            showConfirmModal(`Are you sure you want to ${action} channel with ID ${channelId}?`, async () => {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/channels/${channelId}/toggle_partner`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${adminToken}`
                        }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        showNotification(data.message, 'success');
                        loadAdminChannels(); // Reload the list to reflect changes
                    } else {
                        const errorData = await response.json();
                        showNotification(errorData.error || 'Error changing partner status.', 'error');
                    }
                } catch (error) {
                    console.error('Error toggling partner status:', error);
                    showNotification('Server connection error while changing partner status.', 'error');
                }
            });
        }


        /**
         * Confirms clearing all channels with the user.
         */
        function confirmClearAllChannels() {
            if (!adminToken) {
                showNotification('Authorization error: Missing admin token. Please log in again.', 'error');
                return;
            }
            showConfirmModal('Are you sure you want to delete ALL channels and comments? This is IRREVERSIBLE!', clearAllChannels);
        }

        /**
         * Sends a DELETE request to clear all channels.
         */
        async function clearAllChannels() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/channels/all`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${adminToken}` // Include the token
                    }
                });

                if (response.ok) {
                    showNotification('All channels and comments have been deleted.', 'success');
                    loadAdminChannels(); // Reload the list (it should now be empty)
                } else {
                    const errorData = await response.json();
                    showNotification(errorData.error || 'Error clearing all channels.', 'error');
                }
            } catch (error) {
                console.error('Error clearing all channels:', error);
                showNotification('Server connection error while clearing all channels.', 'error');
            }
        }

        // Initialize admin panel
        document.addEventListener('DOMContentLoaded', function() {
            // No initial load, wait for password verification
        });
    </script>
</body>
</html>
